- id: T03
  title: 'buildStageState: GameState to StageState'
  lane: backend
  brief: |
    Project: The Price Is Live, a group FaceTime price-guessing game show with an AI host (TypeScript, Node 22, one process, no web server).
    Read first: docs/API.md, docs/DATA_MODEL.md and src/contracts/*.ts (the law between lanes). Full spec: docs/SPEC.md; "§" numbers below point into it.
    Rules for every task: run `npm install` first. Change ONLY the files in your lease. Never edit src/contracts/**, src/config.ts, src/testing/fakes.ts, src/stage/theme.ts, fixtures/**, scripts/check-docs.mjs, scripts/scan-secrets.mjs, package.json, docs/API.md or docs/DATA_MODEL.md (request a contract change and keep going; do not add npm packages). Keep the exported names and signatures given in docs/API.md section 5. Tests live in test/ and must run offline: no network, no API keys, no phone, no long real timers (inject fake fetch / WebSocket / SDK / clock). No secrets and no real phone numbers in any file (fake phones are +1214555010x). Never call, text, post or publish anything outside the repo. If something needs a real call, a real key or a human, do not stop: build it with a fallback and add a line under "TO VERIFY ON THE REAL LINE" in your module's header comment. Plain code, small functions, comments in everyday English. You are done when your acceptance commands and `npm run check` all pass.

    YOUR TASK
    Write src/engine/stageState.ts: `buildStageState(state: GameState, now: number, config: GameConfig): StageState` (types in src/contracts/types.ts; what each phase shows is the "Stage shows" column of §7.4 and §13.2). Pure function. It reads only the documented GameState fields, so you can build it before the reducer exists: make GameState objects by hand in the test.
    Mapping rules:
    - title 'THE PRICE IS LIVE'; roundLabel `ROUND {k} OF {n}` from round_start to round_score, else null.
    - podiums: one per player with name, score, seat. role: 'owner' for the current owner, 'guesser' for the current guesser in guess_*, 'winner' for round winners in round_score and for champions in finale, else 'idle'.
    - guessText / guessState per guesser from state.guesses and state.pendingGuess: pending "$25.00 ?", locked "$25.00 ✓", silent or pass "—". In round_score, a locked guess above the price becomes guessState 'over' with plain "$40.00". Use formatCents.
    - delta (round_score only) from the last RoundResult in history: { guess: guessPoints, bonus: 25 for winners else 0, stump: stumpPoints for the owner else 0 }.
    - timer from state.timer: secondsLeft = (startedAt + ms - now) / 1000 clamped at 0, total in seconds, running = phase is guess_listen. Shown in guess_prompt (full, not running), guess_listen and guess_confirm.
    - reveal: null outside reveal and round_score. stage from state.revealStage. priceText and itemName are EMPTY strings until the stage is 'price'. sourceLabel: 'Price list' for source list, 'Google Search: {host of the first web evidence url}' for web, 'Estimate' for estimate.
    - mysteryOwner: the owner's name from round_start through the guess phases. liveTranscript in guess_listen only.
    - caption from state.caption; when it is null in guess_listen use { text: 'Listening...', speaker: 'system' }, in item_resolve 'Checking the price tag...'.
    - joinHint `Text {lineDisplayNumber}: I'm in, I'm {name}` (without the number when it is null) in wait_call, dialing, connected and lobby while under 2 players. banner: 'TEXT REMATCH TO PLAY AGAIN' in rematch_offer, 'THANKS FOR PLAYING' in ending, 'CLOSEST WITHOUT GOING OVER WINS' in rules.
    - fallbackBadge 'TEXT MODE' when state.textMode. lightning from state. hostSpeaking false (the runner overrides it). capRemainingMs = hardCapMs - (now - callStartAt) only when that is 45,000 or less and a call is on, else null.
    - finale (finale, rematch_offer, ending): ranks from rankPlayers, champion from champions, items like "Ethan: Owala FreeSip water bottle $34.99" (add " (estimate)" for estimates).
    The secrecy rule is the most important test: for every phase before the reveal price stage, JSON.stringify(stageState) must not contain the item's displayName, raw text or price text. Also test each phase once (compare with fixtures/stage-states.ts for the expected shape), the timer math, 2/3/4 players and the cap clock.
