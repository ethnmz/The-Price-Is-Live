tasks:
- id: T01
  title: 'Game engine reducer: full game flow'
  lane: engine
  brief: |
    Project: The Price Is Live, a group FaceTime price-guessing game show with an AI host (TypeScript, Node 22, one process, no web server).
    Read first: docs/API.md, docs/DATA_MODEL.md and src/contracts/*.ts (the law between lanes). Full spec: docs/SPEC.md; "§" numbers below point into it.
    Rules for every task: run `npm install` first. Change ONLY the files in your lease. Never edit src/contracts/**, src/config.ts, src/testing/fakes.ts, src/stage/theme.ts, fixtures/**, scripts/check-docs.mjs, scripts/scan-secrets.mjs, package.json, docs/API.md or docs/DATA_MODEL.md (request a contract change and keep going; do not add npm packages). Keep the exported names and signatures given in docs/API.md section 5. Tests live in test/ and must run offline: no network, no API keys, no phone, no long real timers (inject fake fetch / WebSocket / SDK / clock). No secrets and no real phone numbers in any file (fake phones are +1214555010x). Never call, text, post or publish anything outside the repo. If something needs a real call, a real key or a human, do not stop: build it with a fallback and add a line under "TO VERIFY ON THE REAL LINE" in your module's header comment. Plain code, small functions, comments in everyday English. You are done when your acceptance commands and `npm run check` all pass.

    YOUR TASK
    Build the pure game engine in src/engine/reducer.ts: `initialState(config)` and `reduce(state, event, deps)` (types in src/contracts/events.ts; rules in docs/API.md section 4 and the state table in §7.4). No I/O, no Date.now, no Math.random: time comes from `event.at`, everything else from `deps`. Never throw; an event that does not fit the phase returns the same state plus a LOG effect.
    Already written for you (import them, do not rewrite): src/engine/scoring.ts (scoreRound, rankPlayers, champions), src/engine/registry.ts (parseJoinText, addPlayer), src/engine/messages.ts (MSG.*, buildResultsCard). Host text comes only from `deps.line(key, vars)`; emotion from `emotionFor(key)`. Every SPEAK also sets state.caption.
    Flow to implement (this task = everything except the hard clock, lightning mode, auto TEXT MODE and the camera/voice item fallbacks, which are later tasks; leave clear seams):
    - boot -> wait_call on BOOT.
    - wait_call TEXT_RECEIVED: join text -> addPlayer, SEND_TEXT MSG.joinReply (or MSG.gameFull). `start` from the main player with 2+ players -> phase dialing, DIAL {phones}, MSG.calling to everyone, START_TIMER dialTimeoutMs; with under 2 players -> MSG.needTwo. `demo` from the main player turns demo on for the next game (state.demo; totalRounds = min(demoItems, players), short rules, lobby settle 1000 ms, hold-up 3000 ms). `rematch` from any player when a finished roster exists -> dial everyone again. Any other text from a registered player is their item: keep it in pendingItemTexts, emit PRICE_ITEM with itemId `r{seat+1}` and origin 'text', reply MSG.itemReceived. Text from a stranger -> MSG.unknown.
    - dialing: CALL_READY -> connected. CALL_FAILED or the dial timer -> DIAL once more, then MSG.cantConnect and back to wait_call.
    - connected: set callStartAt and gameId (deps.newGameId()), SPEAK connect.hello, then lobby.
    - lobby: joins still work (SPEAK lobby.joined). Go to rules when there are 2+ players and no join for lobbySettleMs, or 4 players, or anyone says/texts "start" or "let's go". Under 2 players after lobbyMaxWaitMs -> SPEAK lobby.giveup -> ending.
    - rules: turnOrder = seat order. SPEAK rules.full (rules.short in demo). Text MSG.itemPrompt(name,'first') to owner 1 unless their item already arrived. PERSIST 'game'. Then round_start.
    - round_start: next owner; guessOrder = the other players in turn order starting after the owner (round 1: p2,p3,p4; round 2: p3,p4,p1). Text MSG.itemPrompt(next owner,'next') if not sent yet. SPEAK round.start {n: round number, owner}.
    - item_resolve: price already here -> show_item. Item text sent but price pending -> SPEAK item.pricing and wait at most priceTimeoutMs. No item text -> wait itemWaitMs. On timeout, PRICE_FAILED or propClosetSuggested -> prop closet: SPEAK item.propcloset and use deps.propItem() as the priced item. The game never blocks here.
    - show_item: SPEAK item.holdup, wait showItemMs, then the first guesser.
    - guess_prompt: LISTEN off, SPEAK guess.quiet (first guesser of the round only) and guess.prompt {name}; then guess_listen.
    - guess_listen: LISTEN on, START_TIMER guessSeconds (textModeGuessSeconds when state.textMode) and set state.timer. SPEECH_PARTIAL updates liveTranscript. SPEECH_FINAL goes through deps.parseGuess: amount -> pendingGuess + guess_confirm; pass -> SPEAK guess.nudge once, a second pass counts as silent; anything else is ignored. A text with a number from the CURRENT guesser's phone locks at once (channel 'text', SPEAK guess.textack, reply MSG.guessReceived); a text without a number from them -> MSG.badGuess. Timer end -> guess_silent.
    - guess_confirm: LISTEN off, SPEAK guess.confirm {amount: spokenForm}, then LISTEN on and START_TIMER confirmSilenceMs. "yes" or the timer -> lock (SPEAK guess.locked). A new amount replaces it and is confirmed once more; a second correction is final. "no" alone -> back to guess_listen with the time that was left (at least minRelistenMs).
    - guess_silent: record status 'silent', SFX buzzer, SPEAK guess.silent {name}.
    - reveal (after the last guesser): LISTEN off, SPEAK reveal.drumroll, SFX drumroll, revealStage 'drumroll', wait drumrollMs; then SFX ding, revealStage 'price', SPEAK reveal.price {price: deps.spokenAmount(cents)} and reveal.estimate when isEstimate; hold revealHoldMs.
    - round_score: scoreRound, update players' score and roundWins, push history, PERSIST 'round' and one 'guess' per guesser (shapes in docs/DATA_MODEL.md section 5). SPEAK score.winner / score.tie / score.allover / score.nowinner, then score.stump (score.stumplow under 20). Wait scoreHoldMs, then the next round or finale.
    - finale: SEND_TEXT buildResultsCard to every player right away, PERSIST 'result', 'game' (with endedAt) and one 'player' each; SFX tada; SPEAK finale.drumroll, finale.champion (or finale.cochamps), finale.thanks.
    - rematch_offer: SPEAK rematch.offer, LISTEN on for rematchListenMs. "rematch" / "again" / "yes" spoken, or a REMATCH text -> rematchRequested, MSG.rematchAck.
    - ending: LISTEN off, SPEAK end.bye, END_CALL. On CALL_ENDED go to wait_call keeping the roster with scores reset; if rematchRequested, dial everyone again at once.
    - CALL_ENDED before ending: if at least one round was scored, text MSG.callDropped(card) to everyone; cancel timers; wait_call.
    Idempotency keys for SEND_TEXT: `${gameId}:${type}:${last4(phone)}:${n}`. Timer ids must be unique per use so late TIMER events are ignored. You may split helpers into src/engine/reducer/*.ts.
    Tests in test/engine.reducer.test.ts drive the reducer with makeFakeDeps() from src/testing/fakes.ts (lines look like `guess.prompt|name=Diego`, amounts parse from digits) using a small loop that answers SPEAK with SPEAK_DONE and fires timers on demand. Cover: a 4-player game with hand-computed final totals; a 2-player game; demo mode (2 rounds, 4 players); everyone over; a tie; a silent guesser; a correction during confirm-back; a text guess; pricing timeout -> prop closet; dial failure then retry; CALL_ENDED mid-game sends the dropped-call text; stray and late events never throw; a rematch text after the game dials again.
  lease:
  - src/engine/reducer.ts
  - src/engine/reducer/**
  - test/engine.reducer.test.ts
  depends_on: []
  contracts:
  - docs/API.md
  - docs/DATA_MODEL.md
  acceptance:
  - npm install --no-audit --no-fund --silent && npx vitest run test/engine.reducer.test.ts
  priority: must
