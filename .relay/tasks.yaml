  priority: must
- id: T04
  title: 'Game runner: execute effects against the ports'
  lane: engine
  brief: |
    Project: The Price Is Live, a group FaceTime price-guessing game show with an AI host (TypeScript, Node 22, one process, no web server).
    Read first: docs/API.md, docs/DATA_MODEL.md and src/contracts/*.ts (the law between lanes). Full spec: docs/SPEC.md; "§" numbers below point into it.
    Rules for every task: run `npm install` first. Change ONLY the files in your lease. Never edit src/contracts/**, src/config.ts, src/testing/fakes.ts, src/stage/theme.ts, fixtures/**, scripts/check-docs.mjs, scripts/scan-secrets.mjs, package.json, docs/API.md or docs/DATA_MODEL.md (request a contract change and keep going; do not add npm packages). Keep the exported names and signatures given in docs/API.md section 5. Tests live in test/ and must run offline: no network, no API keys, no phone, no long real timers (inject fake fetch / WebSocket / SDK / clock). No secrets and no real phone numbers in any file (fake phones are +1214555010x). Never call, text, post or publish anything outside the repo. If something needs a real call, a real key or a human, do not stop: build it with a fallback and add a line under "TO VERIFY ON THE REAL LINE" in your module's header comment. Plain code, small functions, comments in everyday English. You are done when your acceptance commands and `npm run check` all pass.

    YOUR TASK
    Write src/engine/runner.ts exactly as described in docs/API.md section 4 ("Effects out, and what the runner does with each" and the signatures `Scheduler`, `VirtualScheduler`, `RunnerOpts`, `Runner`, `createRunner`). The runner owns the state, calls `opts.reduce`, runs each effect against `opts.ports`, and feeds the answer events back. `reduce`, `initial` and `buildStageState` are passed in, so this task does not need the real reducer: test it with a tiny scripted reducer written inside the test and the fakes from src/testing/fakes.ts (makeFakePorts, makeFakeDeps).
    Details:
    - dispatch() is re-entrancy safe: events are queued and processed one at a time in order.
    - SPEAK effects are spoken strictly one after another; SPEAK_DONE {speakId} is dispatched after each, even if voice.speak rejects.
    - PRICE_ITEM runs in the background (do not block the queue) -> PRICE_READY, or PRICE_FAILED on rejection. IDENTIFY_FROM_CAMERA -> FRAME_ID_READY (label null, confidence 0 when frames or the result are null). DIAL -> on rejection dispatch CALL_FAILED {reason: error message}. SEND_TEXT errors are logged and swallowed. No effect handler may crash the runner.
    - Timers go through the Scheduler (default: real setTimeout/Date.now). START_TIMER with an id that is already running replaces it. stop() clears every timer and the tick.
    - start(): subscribes to voice.onSpeech (isFinal -> SPEECH_FINAL, else SPEECH_PARTIAL), message.onMessage -> TEXT_RECEIVED, call.on('ready') -> CALL_READY, call.on('ended') -> CALL_ENDED, voice.onMouthLevel -> stage.setMouthLevel, voice.onSpeakingChange; calls message.start(); dispatches BOOT; ticks every tickMs (default 1000) with TICK.
    - After every processed event call stage.setState(buildStageState(state, now, deps.config)) with hostSpeaking set from the last onSpeakingChange value.
    - VirtualScheduler: now() starts at 0; advance(ms) fires due timers in time order, moving now() to each timer's time, and awaits pending promises between timers so async port calls settle. This is what lets a 4-minute game run in milliseconds.
    Tests (test/engine.runner.test.ts): each effect type reaches the right fake port; SPEAK order and SPEAK_DONE; timers fire and cancel under VirtualScheduler; a throwing port does not stop the runner; a pricing call that never resolves does not block other events; stage.setState is called after each event; stop() leaves no timers.
  lease:
  - src/engine/runner.ts
  - test/engine.runner.test.ts
  depends_on: []
  contracts:
  - docs/API.md
  - docs/DATA_MODEL.md
  acceptance:
  - npm install --no-audit --no-fund --silent && npx vitest run test/engine.runner.test.ts
  priority: must
