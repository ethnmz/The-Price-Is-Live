    - onRemoteAudio(cb): when a remote audio track is subscribed (prefer the one named `facetime-remote-audio`, else the first remote audio track), read it with an AudioStream at 16,000 Hz mono if the API allows asking for that rate, else resample with src/comms/resample.ts, and call cb with Int16Array frames. Handle track unsubscribed / participant left without throwing. onDisconnected(cb) fires on room disconnect.
