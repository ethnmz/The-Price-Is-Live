    YOUR TASK
    Write src/comms/voice.ts: `createVoice({ sink, tts, stt, now? })` implementing VoicePort (src/contracts/ports.ts) plus pushRemoteAudio() and close(); see docs/API.md section 5, §8.2, §9.2 and tasks D3/D4 in §15.2. It combines the Mixer and synthSfx (src/comms/mixer.ts, sfx.ts), the Tts (src/comms/tts.ts) and an optional SttProvider. It writes to ONE AudioSink and nothing else.
    - Pump: while anything is audible, pull 20 ms frames (480 samples at VOICE_SAMPLE_RATE 24000) from the mixer and `await sink.write(frame, 24000)`; the sink provides real-time pacing. When idle the pump stops (no busy loop).
    - speak(id, text, { emotion }): pcm = await tts.synthesize(text, emotion ?? 'hype'); if audio came back, queue it in the mixer and resolve when its last frame has been written; if null (no key, quota, error), resolve after an estimated duration (about 65 ms per character, minimum 600 ms; an injectable `sleep` option lets tests make it instant) so captions still pace the game. Never rejects. Calls are serialized. stopSpeaking() clears the voice queue and resolves the pending speak.
    - sfx(name): mix synthSfx over whatever is playing; resolves when it ends.
    - onSpeakingChange(true/false) around each spoken line; onMouthLevel about 20 times per second while speaking (the frame level from the mixer) and one final 0.
    - STT gate (§9.2 rules 1 and 2): listen(on) sets the wish. The gate is OPEN only when the wish is on AND the host is not speaking AND at least 400 ms have passed since the host stopped. pushRemoteAudio(pcm16k) forwards audio to stt.pushAudio only while the gate is open (this also saves credits). Transcripts from the provider are emitted through onSpeech only while the gate is open; anything arriving while it is closed is dropped. stt.start() is called lazily on the first listen(true).
    Tests (test/voice.test.ts) with FakeAudioSink, a fake Tts and a fake SttProvider: speak writes exactly the samples of the clip (rounded up to whole frames) and resolves after them; null TTS still resolves; two speaks play in order; sfx over speech keeps one writer (never two sink.write calls in flight); mouth levels are > 0 during speech and end with 0; speaking-change order; the gate drops audio and transcripts while speaking and for 400 ms after (inject `now`), and passes them later; stopSpeaking resolves the pending speak.
