    YOUR TASK
    Create data/reference-items.json: about 200 (at least 180) common home and school items with US retail prices, in the ReferenceItem shape of docs/DATA_MODEL.md section 4 (see fixtures/reference-items.sample.json for 20 examples you may reuse). Rules from §10.2: new, regular US retail price, no sales or bundles; categories to cover: drinkware, school supplies, calculators, headphones, chargers, snacks and drinks, kitchen basics, small appliances, toiletries, cleaning, bedding/decor, small electronics, clothing basics, sports, toys/games, books. Each item: unique id `ref_0001`..., a specific name with brand and size, 2 to 4 lowercase aliases a player might text (aliases unique across the file), category, priceCents 100..100000, source (the manufacturer or retailer domain where that list price is published), checkedAt "2026-11-14".
    HONESTY RULE (this feeds a number we will quote to judges): set "verified": true only if you actually fetched the source page in this session and read the price; otherwise "verified": false and use the regular list price you are confident of. Never invent a URL. data/README.md must say plainly how many items are verified and that the rest are list prices from the model's knowledge, to be spot-checked by a human.
