    YOUR TASK
    Extend the reducer from T01 (src/engine/reducer.ts and helpers) with the timing safety rules of §7.4 ("Hard clock") and §9.2 rule 8 / §9.6. Keep all T01 tests green.
    - Hard clock, checked on every TICK from connected on: elapsed = at - callStartAt. At elapsed >= config.hardCapMs: abandon the round in progress (do not score it), set capHit, cancel timers, LISTEN off, go to finale with the scores so far; the finale then says finale.shortcap instead of finale.drumroll and the results card gets the cap line (buildResultsCard opts.cap = rounds finished of total).
    - Do not start a new round when elapsed >= config.lastRoundStartMs: go to finale instead (capHit true if rounds were skipped).
    - Lightning mode: at each round_start compute projected = elapsed + roundsLeft * avgRoundMs + finaleBufferMs, where avgRoundMs is the mean of roundDurationsMs (avgRoundMsInitial when empty). If projected > hardCapMs set lightning = true for the rest of the game: no guess.quiet after round 1, drumroll lightningDrumrollMs, reveal hold 2000 ms, and skip confirm-back when the parsed guess has confidence >= lightningConfidence and is not ambiguous (lock at once with guess.locked). Demo mode uses the lightning timings from the start.
    - Automatic TEXT MODE: count guess windows in which no SPEECH_PARTIAL or SPEECH_FINAL arrived at all (silentWindows). After two in a row set textMode = true, SPEAK guess.textmode once, and use textModeGuessSeconds for later windows. Any speech resets the count. (Text guesses from the current guesser already work from T01.)
    Tests in test/engine.clock.test.ts (use makeFakeDeps, with small config overrides where handy): slow play hits the cap at 4:30 and reaches finale with the cap line in the card and no half-scored round; no new round after 4:10; lightning switches on when the projection is over and the skipped confirm-back works; two silent windows turn on TEXT MODE and a text guess then locks; a normal fast game never turns lightning on.
  lease:
  - src/engine/reducer.ts
