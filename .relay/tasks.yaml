    YOUR TASK
    Write src/ai/pricing.ts: `createPricing({ items, gemini, search?, store?, timeoutMs = 8000, webTimeoutMs = 6000 })` returning PricingPort (§10.1, §10.3, task A1 in §15.3). It uses cleanItemText and matchList (src/ai/cleanText.ts, matchList.ts), estimatePrice (src/ai/estimate.ts) and an injected SearchProvider (interface in src/contracts/ports.ts; the Gemini implementation is another task, so tests use a fake).
    price(req) NEVER throws and ALWAYS resolves within timeoutMs:
    1. A rejected clean text -> step 6.
    2. Cache: in-memory Map by clean text, then store.getCachedPrice (if a store was given). A hit returns with the new itemId.
    3. List match: best score >= 0.85 and no size conflict -> source 'list', priceCents and displayName from the item, confidence = score, evidence kind 'list'.
    4. Otherwise run web search and estimate IN PARALLEL: search.search(clean) (skip when search is null) and estimatePrice(gemini, clean, top 5 list matches). If the web result arrives within webTimeoutMs with a price -> source 'web', confidence 0.9 when 2+ prices agree within 20% else 0.75, evidence kind 'web' (title, url). Else the estimate -> source 'estimate', isEstimate true, evidence kind 'model'.
    5. No Gemini at all (no key, or both failed): fall back to the best list match if its score >= 0.6 (source 'estimate', isEstimate true, confidence 0.4, that item's price), else a fixed estimate (the median price of the list, confidence 0.2, propClosetSuggested true). Log one clear warning the first time the key is missing.
    6. Not a product / rejected / model says notAProduct -> source 'estimate', isEstimate true, propClosetSuggested true.
    7. Always: clamp priceCents to 100..100000, isEstimate = source 'estimate' or confidence < 0.5, latencyMs measured, displayName = list name or the model's clean product name (title-cased clean text as a last resort). Successful list and web results are cached in memory and sent to store.persist('priceCache', { cleanText, result, createdAt }).
    8. A hard overall timer returns the step-5 fallback at timeoutMs no matter what is still pending.
    identifyFromFrames(jpegs): accept an optional `identify` function in the options and call it; without one, resolve null.
    Tests (test/pricing.test.ts) with the sample list, a fake GeminiClient and a fake SearchProvider: 10 known items come back from the list with the right price; a list miss uses the web result; web too slow -> estimate; Gemini hanging forever -> still resolves by the timeout (use small timeouts); no key -> list-only fallback and no throw; "asdfgh" -> estimate or prop-closet flag, no crash; size conflict goes to web/estimate; second call is a cache hit; results always within 100..100000 and correctly labelled isEstimate.
